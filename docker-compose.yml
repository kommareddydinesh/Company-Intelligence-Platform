services:
  postgres:
    image: postgres:16-alpine
    container_name: cip_postgres
    environment:
      POSTGRES_DB: company_intel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Dinesh06012006
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/postgres_schema.sql:/docker-entrypoint-initdb.d/postgres_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18-community
    container_name: cip_neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: cip_chromadb
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma

  redis:
    image: redis:7-alpine
    container_name: cip_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cip_backend
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:Dinesh06012006@postgres:5432/company_intel_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_enterprise_jwt_key_2026_change_in_prod
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      chromadb:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cip_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cip_celery_worker
    command: python -m services.data_pipeline
    restart: on-failure
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:Dinesh06012006@postgres:5432/company_intel_db
    depends_on:
      - redis
      - backend

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  redis_data:
